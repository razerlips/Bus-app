<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鬼無里線バス</title>
<meta name="description" content="長野市営バス鬼無里線の便を、タップでiPhoneのカレンダーに追加">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-title" content="バス予定">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* Layout: one narrow column like a bus-stop pole sign — date + route at top, trip rows below */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1d2620; --muted:#5d6b62; --line:#d6ddd6;
  --accent:#1f6b4a; --accent-ink:#ffffff; --led:#9a5800; --led-bg:#fff4e2; --warn:#a33a2a; --warn-bg:#fdecea;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121815; --surface:#1b2420; --ink:#e6ece7; --muted:#9aa89f; --line:#2c3832;
  --accent:#5fbf8f; --accent-ink:#0d1a13; --led:#ffb547; --led-bg:#2a2216; --warn:#ff8a75; --warn-bg:#3a1f1a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.badge{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:2px 12px;font-size:13px;letter-spacing:.08em}
h1{font-size:18px;margin:0}
.muted{color:var(--muted);font-size:13px;margin:0}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 12px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.seg input[type=date]{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 8px;font-size:15px;min-width:0}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin:0}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:0 0 6px}
.routes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.routes button{white-space:nowrap;flex:none}
.routes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.routes .addr{border-style:dashed;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.pick label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.pick select{font-size:16px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.danger{color:var(--warn)}
.msg{font-size:13px;color:var(--warn);margin:0;min-height:1em}
.trips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.trip .t{flex:1;min-width:0;display:flex;flex-direction:column}
.trip .times{white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;letter-spacing:.02em}
.trip .times .arr{color:var(--muted);font-weight:400}
.trip .meta{font-size:12px;color:var(--muted)}
.trip .next{background:var(--led-bg);color:var(--led);font-weight:700;border-radius:6px;padding:0 6px;margin-left:6px}
.trip.past{opacity:.45}
.trip .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding:10px 12px;white-space:nowrap}
.trip .go.done{background:var(--surface);color:var(--accent)}
.foot{display:flex;flex-direction:column;gap:10px}
.foot label{display:flex;align-items:center;gap:8px;font-size:14px}
.foot select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="badge">鬼無里線</span><h1>バス予定</h1></div>
    <span class="muted">平日のみ運行</span>
  </header>

  <section>
    <p class="label">乗る日</p>
    <div class="seg" id="days">
      <button type="button" data-d="0">今日</button>
      <button type="button" data-d="1">明日</button>
      <input type="date" id="date" aria-label="日付を選ぶ">
    </div>
  </section>
  <p class="alert" id="weekend" hidden>この日は土日です。鬼無里線は平日のみの運行です。祝日・年末年始の運行も時刻表で確認してください。</p>

  <section>
    <p class="label">区間</p>
    <div class="routes" id="routes"></div>
  </section>

  <section class="panel" id="editor" hidden>
    <div class="pick">
      <label for="from">乗るバス停<select id="from"></select></label>
      <button type="button" id="swap" aria-label="乗る・降りるを入れ替え">⇄</button>
      <label for="to">降りるバス停<select id="to"></select></label>
    </div>
    <div class="row">
      <label class="check" for="ret"><input type="checkbox" id="ret" checked>帰りの区間も登録</label>
      <div class="row">
        <button type="button" id="cancel">閉じる</button>
        <button type="button" class="primary" id="save">登録</button>
      </div>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section>
    <p class="label" id="tripsLabel">便</p>
    <ul class="trips" id="trips"></ul>
  </section>

  <section class="foot">
    <label for="alarm">通知
      <select id="alarm">
        <option value="0">なし</option>
        <option value="5">5分前</option>
        <option value="10">10分前</option>
        <option value="15" selected>15分前</option>
        <option value="30">30分前</option>
      </select>
    </label>
    <div class="row">
      <button type="button" class="danger" id="del">この区間を削除</button>
    </div>
    <p class="muted">時刻は長野市営バス鬼無里線の時刻表（2026年4月1日制定・素案）の通過予定時刻です。道路状況で遅れることがあります。</p>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  const KEY = "busapp-kinasa-v1";
  const DATA = await fetch("data/kinasa.json").then(r => r.json());
  const STOPS = DATA.down.map(s => s[0]);
  const T = { down: Object.fromEntries(DATA.down), up: Object.fromEntries(DATA.up) };
  const pretty = n => n.replace("旅の駅鬼無里", "旅の駅 鬼無里");

  // ---- state (per device) ----
  let st = { routes: [], cur: 0, alarm: 15 };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  let day = new Date(); day.setHours(0, 0, 0, 0);
  const added = new Set();

  // ---- helpers ----
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dirOf = r => STOPS.indexOf(r.from) < STOPS.indexOf(r.to) ? "down" : "up";
  const trips = r => { const d = dirOf(r); return T[d][r.from].map((t, i) => ({ dep: t, arr: T[d][r.to][i] })); };
  const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const at = (d, t) => { const [h, m] = t.split(":").map(Number); return new Date(`${ymd(d)}T${pad(h)}:${pad(m)}:00+09:00`); };
  const utc = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const esc = s => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,");
  function fold(line) { // RFC 5545: max 75 octets per line
    const enc = new TextEncoder(); const out = []; let cur = "", len = 0;
    for (const ch of line) {
      const b = enc.encode(ch).length;
      if (len + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; len = 0; }
      cur += ch; len += b;
    }
    out.push(cur); return out.join("\r\n ");
  }

  function buildICS(r, t) {
    const start = at(day, t.dep), end = at(day, t.arr);
    const dirName = dirOf(r) === "down" ? "鬼無里方面" : "長野方面";
    const L = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//bus-app//kinasa//JA", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      `UID:kinasa-${utc(start)}-${STOPS.indexOf(r.from)}-${STOPS.indexOf(r.to)}@bus-app`,
      `DTSTAMP:${utc(new Date())}`,
      `DTSTART:${utc(start)}`, `DTEND:${utc(end)}`,
      `SUMMARY:${esc(`🚌 ${t.dep} ${pretty(r.from)} → ${t.arr} ${pretty(r.to)}`)}`,
      `LOCATION:${esc(`${pretty(r.from)}（バス停）`)}`,
      `DESCRIPTION:${esc(`長野市営バス 鬼無里線 ${dirName}`)}`,
    ];
    if (st.alarm > 0) L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:バスの時間です", `TRIGGER:-PT${st.alarm}M`, "END:VALARM");
    L.push("END:VEVENT", "END:VCALENDAR");
    return L.map(fold).join("\r\n") + "\r\n";
  }

  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4000);
  }

  // ---- render ----
  function renderDays() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((day - today) / 864e5);
    document.querySelectorAll("#days button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.d) === diff)));
    $("date").value = ymd(day);
    $("weekend").hidden = !(day.getDay() === 0 || day.getDay() === 6);
  }

  function renderRoutes() {
    const box = $("routes");
    box.innerHTML = st.routes.map((r, i) =>
      `<button type="button" data-i="${i}" aria-pressed="${i === st.cur}">${pretty(r.from)} → ${pretty(r.to)}</button>`
    ).join("") + `<button type="button" class="addr" id="openEditor">＋ 区間を登録</button>`;
    $("del").hidden = !st.routes.length;
  }

  function renderTrips() {
    const ul = $("trips"), r = st.routes[st.cur];
    if (!r) {
      $("tripsLabel").textContent = "便";
      ul.innerHTML = `<li class="muted">まず「＋ 区間を登録」で、乗るバス停と降りるバス停を選んでください。</li>`;
      return;
    }
    $("tripsLabel").textContent = `便（${dirOf(r) === "down" ? "鬼無里方面" : "長野方面"}・${day.getMonth() + 1}/${day.getDate()}）`;
    const now = new Date();
    let nextMarked = false;
    ul.innerHTML = trips(r).map((t, i) => {
      const past = at(day, t.dep) < now;
      const isNext = !past && !nextMarked; if (isNext) nextMarked = true;
      const key = `${ymd(day)}|${st.cur}|${i}`;
      const dur = mins(t.arr) - mins(t.dep);
      return `<li class="trip${past ? " past" : ""}">
        <div class="t">
          <span class="times">${t.dep}<span class="arr"> → ${t.arr}</span></span>
          <span class="meta">${pretty(r.from)} 発・約${dur}分${isNext ? '<span class="next">次の便</span>' : ""}</span>
        </div>
        <button type="button" class="go${added.has(key) ? " done" : ""}" data-i="${i}">${added.has(key) ? "追加済み" : "カレンダーに追加"}</button>
      </li>`;
    }).join("");
  }

  const render = () => { renderDays(); renderRoutes(); renderTrips(); $("alarm").value = String(st.alarm); };

  // ---- editor ----
  const fill = (sel, v) => { sel.innerHTML = STOPS.map(s => `<option value="${s}">${pretty(s)}</option>`).join(""); sel.value = v; };
  fill($("from"), "長野駅"); fill($("to"), "鬼無里支所");
  const openEditor = () => { $("editor").hidden = false; $("msg").textContent = ""; $("from").focus(); };

  $("routes").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "openEditor") return openEditor();
    st.cur = Number(b.dataset.i); save(); render();
  });
  $("swap").addEventListener("click", () => { const f = $("from").value; $("from").value = $("to").value; $("to").value = f; });
  $("cancel").addEventListener("click", () => { $("editor").hidden = true; });
  $("save").addEventListener("click", () => {
    const from = $("from").value, to = $("to").value;
    if (from === to) { $("msg").textContent = "乗るバス停と降りるバス停が同じです。"; return; }
    const has = (f, t) => st.routes.findIndex(r => r.from === f && r.to === t);
    if (has(from, to) < 0) st.routes.push({ from, to });
    if ($("ret").checked && has(to, from) < 0) st.routes.push({ from: to, to: from });
    st.cur = has(from, to); save();
    $("editor").hidden = true; render();
  });
  $("del").addEventListener("click", () => {
    const b = $("del");
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "もう一度タップで削除"; setTimeout(() => { b.dataset.armed = ""; b.textContent = "この区間を削除"; }, 3000); return; }
    st.routes.splice(st.cur, 1); st.cur = 0; b.dataset.armed = ""; b.textContent = "この区間を削除"; save(); render();
  });

  // ---- date & alarm ----
  $("days").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    day = new Date(); day.setHours(0, 0, 0, 0); day.setDate(day.getDate() + Number(b.dataset.d)); render();
  });
  $("date").addEventListener("change", e => {
    if (!e.target.value) return;
    const [y, m, d] = e.target.value.split("-").map(Number); day = new Date(y, m - 1, d); render();
  });
  $("alarm").addEventListener("change", e => { st.alarm = Number(e.target.value); save(); });

  // ---- add to calendar ----
  $("trips").addEventListener("click", e => {
    const b = e.target.closest(".go"); if (!b) return;
    const r = st.routes[st.cur], i = Number(b.dataset.i), t = trips(r)[i];
    const ics = buildICS(r, t);
    window.__lastICS = ics;
    // iOS Safari blocks top-level data: URLs, so hand it a Blob with the calendar type instead.
    const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    added.add(`${ymd(day)}|${st.cur}|${i}`);
    renderTrips();
    toast("予定の画面が出たら「追加」をタップしてください");
  });

  if (!st.routes.length) openEditor();
  render();
})();
</script>
</body>
</html>
